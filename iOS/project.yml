# Xcode project definition for WorldClock. Generate with: xcodegen generate
#
# The generated WorldClock.xcodeproj IS committed, so nothing here is required to
# open, build, or run the app. This file exists so build settings stay
# reviewable in a diff instead of buried in project.pbxproj. If you edit
# settings in Xcode's UI, mirror them here or the next `xcodegen generate`
# will revert them.

name: WorldClock
options:
  bundleIdPrefix: org.surajshetty
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  WorldClock:
    type: application
    # One shared source tree built for both platforms — XcodeGen generates
    # WorldClock_iOS and WorldClock_macOS targets from this single definition.
    platform: [iOS, macOS]
    sources:
      - path: WorldClock
    dependencies:
      - target: WorldClockWidget_${platform}
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: WorldClock/Info.plist
      properties:
        CFBundleDisplayName: WorldClock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # Read by SharedCities on macOS, where app groups are team-prefixed.
        AppGroup: $(TeamIdentifierPrefix)org.surajshetty.worldclockapp
    settings:
      base:
        PRODUCT_NAME: WorldClock
        PRODUCT_BUNDLE_IDENTIFIER: org.surajshetty.worldclockapp
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Group shared with the widget (SharedCities). The macOS app joins its
        # team-prefixed group without being sandboxed; only the widget is.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": WorldClock/WorldClock.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WorldClock/WorldClock-macOS.entitlements

  # Home-screen (iOS) / desktop (macOS) widget. Built for both platforms only
  # because the app target is — XcodeGen can't make the app's dependency on it
  # iOS-only — and macOS requires extensions to be sandboxed. Reuses the app's
  # sky drawing and saved-city list directly rather than a shared framework: it's four files.
  WorldClockWidget:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - path: WorldClockWidget
      - path: WorldClock/Views/BackgroundView.swift
      - path: WorldClock/Views/SkyMotion.swift
      - path: WorldClock/Sky
      - path: WorldClock/DesignSystem/Theme.swift
      - path: WorldClock/Models/ClockEntry.swift
      - path: WorldClock/Models/SharedCities.swift
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: WorldClockWidget/Info.plist
      properties:
        CFBundleDisplayName: WorldClock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(TeamIdentifierPrefix)org.surajshetty.worldclockapp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WorldClockWidget
        PRODUCT_BUNDLE_IDENTIFIER: org.surajshetty.worldclockapp.widget
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WorldClockWidget/WorldClockWidget.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": WorldClockWidget/WorldClockWidget-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

  WorldClockTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorldClockTests
    dependencies:
      - target: WorldClock_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.surajshetty.worldclockapp.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  WorldClock_iOS:
    build:
      targets:
        WorldClock_iOS: all
        WorldClockTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorldClockTests

  WorldClock_macOS:
    build:
      targets:
        WorldClock_macOS: all
    run:
      config: Debug
